<!doctype html>
<html lang="en">
  <head>
    <title>Trajectories</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      #scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      aside {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(255, 255, 255, 0.9);
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: 100;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        padding: 4px 8px;
        text-align: center;
      }
      th {
        font-size: 12px;
        color: #666;
      }
      input[type='number'] {
        width: 60px;
      }
      input[type='color'] {
        width: 40px;
        height: 24px;
        padding: 0;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="scene"></main>
    <aside>
      <form action="" id="body-params">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>X</th>
              <th>Y</th>
              <th>Z</th>
              <th>Vel X</th>
              <th>Vel Y</th>
              <th>Vel Z</th>
              <th>Mass</th>
              <th>Radius</th>
              <th>Color</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Body 1</td>
              <td><input type="number" data-body="0" data-field="x" /></td>
              <td><input type="number" data-body="0" data-field="y" /></td>
              <td><input type="number" data-body="0" data-field="z" /></td>
              <td><input type="number" data-body="0" data-field="velX" /></td>
              <td><input type="number" data-body="0" data-field="velY" /></td>
              <td><input type="number" data-body="0" data-field="velZ" /></td>
              <td>
                <input
                  type="number"
                  data-body="0"
                  data-field="mass"
                  min="1"
                  step="1"
                  max="1000"
                />
              </td>
              <td>
                <input
                  type="number"
                  data-body="0"
                  data-field="radius"
                  min="1"
                  step="1"
                  max="10"
                />
              </td>
              <td>
                <input
                  type="color"
                  data-body="0"
                  data-field="color"
                  value="#ff0000"
                />
              </td>
            </tr>
            <tr>
              <td>Body 2</td>
              <td><input type="number" data-body="1" data-field="x" /></td>
              <td><input type="number" data-body="1" data-field="y" /></td>
              <td><input type="number" data-body="1" data-field="z" /></td>
              <td><input type="number" data-body="1" data-field="velX" /></td>
              <td><input type="number" data-body="1" data-field="velY" /></td>
              <td><input type="number" data-body="1" data-field="velZ" /></td>
              <td>
                <input
                  type="number"
                  data-body="1"
                  data-field="mass"
                  min="1"
                  step="1"
                  max="1000"
                />
              </td>
              <td>
                <input
                  type="number"
                  data-body="1"
                  data-field="radius"
                  min="1"
                  step="1"
                  max="10"
                />
              </td>
              <td>
                <input
                  type="color"
                  data-body="1"
                  data-field="color"
                  value="#00ff00"
                />
              </td>
            </tr>
            <tr>
              <td>Body 3</td>
              <td><input type="number" data-body="2" data-field="x" /></td>
              <td><input type="number" data-body="2" data-field="y" /></td>
              <td><input type="number" data-body="2" data-field="z" /></td>
              <td><input type="number" data-body="2" data-field="velX" /></td>
              <td><input type="number" data-body="2" data-field="velY" /></td>
              <td><input type="number" data-body="2" data-field="velZ" /></td>
              <td>
                <input
                  type="number"
                  data-body="2"
                  data-field="mass"
                  min="1"
                  step="1"
                  max="1000"
                />
              </td>
              <td>
                <input
                  type="number"
                  data-body="2"
                  data-field="radius"
                  min="1"
                  step="1"
                  max="10"
                />
              </td>
              <td>
                <input
                  type="color"
                  data-body="2"
                  data-field="color"
                  value="#0000ff"
                />
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </aside>
  </body>
</html>
