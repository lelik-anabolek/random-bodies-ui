[package]
name = "wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.125"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
gravity-interaction-calc = { git = "https://github.com/lelik-anabolek/gravity-interaction-calc", version = "0.0.1" }
nalgebra = { version = "0.34.2" }

[profile.release]
opt-level = "z"
lto = true
